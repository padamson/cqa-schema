[schema]
name = "cqa"
version = "0.1.1"
linkml = "1.7.0"

[files]
main = "schema/cqa.yaml"

# No `versions` or `current`: every `v<semver>` tag is a version and the
# newest release is current, so a release is the version bump on main plus
# its tag.
[publishing]
edge = "main"
output_dir = "site/schema"
format = "html"

# A new edition starts at a release: add its book directory and an entry
# whose `from` is that release.
[editions]
output_dir = "site"

[[editions.edition]]
id = "1"
name = "First edition"
book = "book/editions/1"
from = "v0.1.0"

[[editions.edition]]
id = "2"
name = "Second edition"
book = "book/editions/2"
from = "v0.2.0"
authoring = true

# Unpinned, so each plugin comes from PATH: the dogfood debug builds
# locally, the docs.yml installs in CI. Listed only for their `install`,
# which writes the gitignored assets into each edition's checkout.
[editions.toolchain]

[[editions.toolchain.plugin]]
name = "mdbook-admonish"
install = ["install", "."]

[[editions.toolchain.plugin]]
name = "mdbook-listings"
install = ["install"]

[book_link]
enabled = true
schema_path = "schema/current/"
label = "Schema reference"
