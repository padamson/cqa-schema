name: Build and publish docs

on:
  push:
    branches: [main]
  # No tag trigger: a tag runs the workflow stored in its own commit, and
  # a patch on an older line carries that line's workflow. Publish such a
  # tag by dispatching this workflow on main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt the JS-based actions (actions/cache, actions/checkout,
# actions/upload-artifact, ...) into Node 24 ahead of the June 2026
# default flip. Removes the deprecation warnings; safe to drop the
# FORCE_ line once Node 24 becomes the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Exact pins for the tools that build the book and the schema pages: a
  # patch release can change rendered output, and the book's premise is
  # frozen listings. mdbook and wasm-pack get the same exactness from the
  # install-action SHA (their install step says how), so only a tool that
  # action's manifest lacks is pinned here.
  # panschema and mdbook-admonish install from their branch tips on
  # purpose (the dogfood loop) and are not pinned here.
  MDBOOK_LISTINGS_VERSION: "0.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # publish and editions read every version tag

      # --- Resolve producer main HEAD SHAs (dogfood-matrix conventions) ---

      - name: Resolve latest panschema main SHA
        id: panschema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/panschema/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve mdbook-admonish fork branch SHA
        id: mdbook-admonish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/mdbook-admonish/commits/feat/mdbook-0.5-compat --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      # --- Release binaries (mdbook, and wasm-pack for panschema) ---

      - name: Install mdbook and wasm-pack (install-action)
        # No version on either tool: the action resolves each from a
        # manifest fixed at its pinned SHA, so the SHA is the tool pin.
        # `fallback: none` fails the step on a tool the manifest lacks
        # rather than building it through cargo-binstall. To hold one back,
        # write `mdbook@<version>` with a comment saying why.
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: mdbook,wasm-pack
          fallback: none

      - name: Read the installed wasm-pack version
        id: wasm-pack
        # Fails rather than write an empty version, which would key the
        # panschema cache on no wasm-pack at all.
        run: |
          version=$(wasm-pack --version)
          version=${version#wasm-pack }
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --- panschema (needs wasm-pack as a build prerequisite) ---

      - name: Cache panschema binaries
        id: cache-panschema
        uses: actions/cache@v4
        with:
          # panschema (schema docs) + mdbook-panschema (book→schema toolbar
          # link installer) build from the same workspace at the same rev.
          # The `-bins-` key prefix (vs the old `panschema-`) deliberately
          # busts pre-mdbook-panschema cache entries that hold only the one
          # binary. The wasm-pack version is in the key because wasm-pack
          # builds the viz embedded in panschema: without it, a wasm-pack
          # bump waits for panschema's main to move before it takes effect.
          path: |
            ~/.cargo/bin/panschema
            ~/.cargo/bin/mdbook-panschema
          key: panschema-bins-${{ runner.os }}-${{ steps.panschema.outputs.sha }}-wasm-pack-${{ steps.wasm-pack.outputs.version }}

      - name: Install panschema binaries from main
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        # One install, two binaries: the `panschema` crate ships both
        # `panschema` and `mdbook-panschema`. Installing the preprocessor
        # separately fails — there is no `mdbook-panschema` crate to find.
        run: |
          cargo install --git https://github.com/padamson/panschema \
            --rev ${{ steps.panschema.outputs.sha }} \
            --locked --force \
            panschema

      # --- mdbook preprocessors ---

      - name: Cache mdbook-listings binary
        id: cache-mdbook-listings
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-listings
          key: mdbook-listings-${{ runner.os }}-${{ env.MDBOOK_LISTINGS_VERSION }}

      - name: Install mdbook-listings from crates.io
        # Switched off git-main to the released crate (v0.1.1, 2026-08-01):
        # everything the prerelease dogfood exercised — appendix numbering,
        # captions, list-of-listings, the soft-wrap/font-load badge fixes —
        # is in the release, so there's no reason left to track git.
        if: steps.cache-mdbook-listings.outputs.cache-hit != 'true'
        run: cargo install mdbook-listings --version "$MDBOOK_LISTINGS_VERSION" --locked

      - name: Cache mdbook-admonish binary
        id: cache-mdbook-admonish
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-admonish
          key: mdbook-admonish-${{ runner.os }}-${{ steps.mdbook-admonish.outputs.sha }}

      - name: Install mdbook-admonish from fork branch
        if: steps.cache-mdbook-admonish.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/padamson/mdbook-admonish \
            --rev ${{ steps.mdbook-admonish.outputs.sha }} \
            --locked --force \
            mdbook-admonish

      # --- Build outputs ---

      - name: Verify the frozen worked example (panschema)
        # Appendix A embeds wine's benchmark, frozen from the repository that
        # authors it, and ch07 states that it conforms. Without this step the
        # chapter's conformance claim goes unchecked and rots silently the
        # next time the schema tightens.
        # Each is held to the schema it was written for, not to main, so an
        # edition's claim survives the schema moving on.
        run: scripts/verify-frozen-benchmarks.sh

      - name: Check the fixtures (panschema)
        # Each benchmark in data/ meant to fail fails with the one finding
        # its `# expect:` line names, and the value claims hold against
        # wine. A fixture that starts failing for another reason fails here.
        run: scripts/verify-fixtures.sh

      - name: Generate machine-readable artifacts (panschema)
        # TTL (schema + A-box KG), SHACL shapes, JSON Schema, and the
        # instance-graph JSON — the "Other formats" the book names but the
        # publish path never emits. Reads panschema.toml and lands in
        # site/artifacts/, deployed with the site. --strict fails on hard
        # errors (unmodeled constructs, dangling refs, instance-data
        # violations); it is narrower than its name — NOT the
        # unprojected-construct / Postgres-skip / SHACL-skip warnings.
        run: panschema generate --strict

      - name: Publish versioned schema docs (panschema)
        # Output layout: site/schema/main/ (edge), site/schema/current/
        # (alias for the newest release), plus site/schema/<tag>/ for each
        # v<semver> tag.
        run: panschema publish

      - name: Verify frozen listings (mdbook-listings)
        # Fail fast on frozen-snapshot hash drift or a broken
        # {{#include}} / {{#callout}} before the longer book build.
        # Mirrors the local prek/pre-commit hook (.pre-commit-config.yaml).
        run: |
          for book in book/editions/*/; do
            mdbook-listings verify --book-root "$book"
          done

      - name: Build the book editions (mdbook-panschema)
        # Each edition lands at site/book/<id>/ and the current one is
        # copied to the site root, beside site/schema/ from publish above.
        # It builds from main's commit through a scratch index, so the asset
        # installs never touch this tree.
        run: mdbook-panschema editions

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    # GitHub Pages on a private repo requires a paid plan, so on a private
    # instantiation `deploy-pages` 404s and reds the whole run even though
    # `build` — the real verification — passed. Skip deploying while the repo
    # is private; it resumes automatically if the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test deployed Pages
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20    # initial Pages propagation grace
          for path in "" "book/1/" "schema/main/" "schema/current/"; do
            full="${URL%/}/$path"
            for attempt in 1 2 3; do
              if curl -fsSL -o /dev/null "$full"; then
                echo "OK  $full"
                break
              fi
              [ "$attempt" -eq 3 ] && { echo "FAIL $full (3 attempts)"; exit 1; }
              sleep 10
            done
          done
          echo "All paths return 200."
