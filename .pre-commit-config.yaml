# prek / pre-commit hooks for this ontology-authoring repo.
#
# Compatible with both `prek` (the Rust reimplementation) and vanilla
# `pre-commit` — same config format. Install the runner once:
#   prek install        # or: pre-commit install
#
# All hooks are `local` (language: system): they invoke binaries already on
# PATH, matching the dogfood setup (see README "Dogfooding the tooling"), so
# no remote hook repos are pulled. Required on PATH:
#   - mdbook-listings (main HEAD — dogfood; see the dogfood-loop notes)
#   - panschema (main HEAD — verifies the benchmarks and fixtures)
#   - jq (reads verify's JSON findings in the fixtures hook)
#   - perl + git (for the line-width gate; both standard)
repos:
  - repo: local
    hooks:
      - id: mdbook-listings-verify
        name: mdbook-listings verify (frozen listing drift)
        # Fails on a frozen snapshot whose bytes no longer match
        # listings.toml (edited but not re-frozen), a broken
        # {{#include}} / {{#callout}}, or a frozen line over book.toml's
        # max-line-width. The integrity check `mdbook build` does not run
        # on its own. Run against each edition's book root.
        entry: >-
          bash -c 'for book in book/editions/*/; do
          mdbook-listings verify --book-root "$book" || exit 1;
          done'
        language: system
        pass_filenames: false
        files: ^(schema/[^/]+\.yaml|book/editions/[^/]+/(src/.*\.md|src/listings/.*|listings\.toml|book\.toml))$

      - id: schema-line-width
        name: schema content line width (<=72, excl. CALLOUT markers)
        # The same 72-column budget as book.toml's max-line-width, checked
        # on the schema as it is edited. The book's budget bites only at
        # freeze, and an edition can go many commits between freezes.
        # Comment-aware (skips CALLOUT marker lines), which yamllint
        # --strict can't do without false-failing on them.
        entry: scripts/check-line-width.sh
        language: system
        pass_filenames: false
        files: ^schema/[^/]+\.yaml$

      - id: frozen-benchmarks-verify
        name: panschema verify (frozen benchmarks conform to their schema)
        # The frozen worked example in each edition's listings, which
        # Appendix A embeds and ch07 claims conforms. Each is checked
        # against the schema it was written for, paired in the script.
        entry: scripts/verify-frozen-benchmarks.sh
        language: system
        pass_filenames: false
        files: ^(scripts/verify-frozen-benchmarks\.sh|book/editions/[^/]+/src/listings/.*\.yaml)$

      - id: fixtures-verify
        name: panschema verify (fixtures fail as written, value claims hold)
        # Each benchmark in data/ meant to fail fails with the one finding
        # its `# expect:` line names, and the value claims hold against wine.
        entry: scripts/verify-fixtures.sh
        language: system
        pass_filenames: false
        files: ^(schema/[^/]+\.yaml|data/.*\.yaml|panschema(-publish)?\.toml|panschema\.lock|scripts/(verify-fixtures|schema-path)\.sh)$
