# Value claims that hold against wine's worked-example graph at 0.2.1.
# The first four questions and their anchors are wine's own (CQ-wine 2,
# 4, 6 and 7), with expected values added. The last is ours: wine asks
# for no order, so it orders wine's pairings by their confidence. The
# budget is the least the count bound accepts, the most anchors any
# question here has (cq-06 and cq-07), so counting cq-07's citations twice
# would fail it. A benchmark meant for grading would set more.
id: expected-values-hold
target_schema: https://w3id.org/wine-linkml/
target_schema_version: 0.2.1
target_datasets:
  - dataset: worked-example
    version: 0.2.1
retrieval_budget: 4
citation_precision_floor: 0.5
competency_question_answers:
  - id: cq-02
    question: Is Bordeaux a red or white wine?
    ground_truth: Red.
    answer_kind: [lookup]
    expected_anchors: [bordeaux-wine]
    expected_values:
      - record: bordeaux-wine
        slot: color
        value: red
  - id: cq-04
    question: What is the best choice of wine for grilled meat?
    ground_truth: >-
      The Cabernet Sauvignon, on the pr-cabsauv-grilledmeat
      recommendation, with confidence 0.9.
    answer_kind: [attribution]
    expected_anchors:
      - grilled-meat
      - cabernet-sauvignon
      - pr-cabsauv-grilledmeat
    expected_citations: [pr-cabsauv-grilledmeat]
    expected_values:
      - record: pr-cabsauv-grilledmeat
        slot: wine
        value: cabernet-sauvignon
      - record: pr-cabsauv-grilledmeat
        slot: confidence
        value: '0.9'
  - id: cq-06
    question: >-
      Does a bouquet or body of a specific wine change with vintage year?
    ground_truth: >-
      Yes. The 2017 and 2018 Napa Zinfandel differ in body: medium
      against full.
    answer_kind: [comparison]
    expected_anchors:
      - napa-zinfandel-2017
      - napa-zinfandel-2018
      - vy-2017
      - vy-2018
    expected_values:
      - record: napa-zinfandel-2017
        slot: body
        value: medium
      - record: napa-zinfandel-2018
        slot: body
        value: full
  - id: cq-07
    question: What were good vintages for Napa Zinfandel?
    ground_truth: >-
      2018. The regional vintage chart rates 2018 good and 2017 average.
    answer_kind: [attribution, comparison]
    expected_anchors:
      - napa-zinfandel-2018
      - napa-zinfandel-2017
      - va-napa-zin-2018
      - va-napa-zin-2017
    expected_citations: [va-napa-zin-2018, va-napa-zin-2017]
    expected_values:
      - record: va-napa-zin-2018
        slot: verdict
        value: good
      - record: va-napa-zin-2017
        slot: verdict
        value: average
  - id: pairings-by-confidence
    question: >-
      Which pairings are recommended, from the least confident to the
      most?
    ground_truth: >-
      Beaujolais with roast chicken at 0.7, Napa Chardonnay with a
      seafood dish at 0.85, and Cabernet Sauvignon with grilled meat at
      0.9.
    answer_kind: [comparison]
    expected_anchors:
      - pr-beaujolais-chicken
      - pr-chardonnay-seafood
      - pr-cabsauv-grilledmeat
    expected_values:
      - record: pr-cabsauv-grilledmeat
        slot: confidence
        value: '0.9'
      - record: pr-beaujolais-chicken
        slot: confidence
        value: '0.7'
      - record: pr-chardonnay-seafood
        slot: confidence
        value: '0.85'
    ordered_by: confidence
