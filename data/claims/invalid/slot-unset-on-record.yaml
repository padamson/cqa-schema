# Wine carries maker, but bordeaux-wine has none. Unset is a failure, not a match.
# expect: value-claim/unset
id: broken-benchmark
target_schema: https://w3id.org/wine-linkml/
target_schema_version: 0.2.1
target_datasets:
  - dataset: worked-example
    version: 0.2.1
competency_question_answers:
  - id: cq-01
    question: Who makes the Bordeaux?
    ground_truth: Napa Cellars.
    answer_kind: [lookup]
    expected_anchors: [bordeaux-wine]
    expected_values:
      - record: bordeaux-wine
        slot: maker
        value: napa-cellars
