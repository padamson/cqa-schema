# The graph says 0.8. A number compares by value, so '0.80' would hold.
# expect: value-claim/differs at `confidence`
id: broken-benchmark
target_schema: https://w3id.org/wine-linkml/
target_schema_version: 0.2.1
target_datasets:
  - dataset: worked-example
    version: 0.2.1
competency_question_answers:
  - id: cq-01
    question: How confident is the vintage chart about 2018?
    ground_truth: 0.85.
    answer_kind: [lookup]
    expected_anchors: [va-napa-zin-2018]
    expected_values:
      - record: va-napa-zin-2018
        slot: confidence
        value: '0.85'
