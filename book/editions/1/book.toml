[book]
authors = ["Paul Adamson"]
language = "en"
src = "src"
title = "Building cqa"
description = "Building the cqa LinkML ontology from scratch, following Ontology Development 101 adapted to LinkML"

[build]
build-dir = "build"

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.listings]
command = "mdbook-listings"
before = ["admonish", "links"]
number-listings = true
# In-page {{#list-of-listings}} index (src/list-of-listings.md) plus each
# page's listings nested under their section in the sidebar.
list-of-listings = true
list-of-listings-sidebar = "nested"
# A line under each caption naming the source and its tag, so a diff
# says which two snapshots it compares.
show-listing-provenance = true
# Column budget for listing lines as they render (CALLOUT marker lines are
# stripped, so they don't count). `freeze` refuses a source with a longer
# line and `verify` fails on a frozen listing with one; content the book
# can't reflow takes `allow-long-lines = true` on its listings.toml record.
# Wrapped YAML reads badly: indentation carries the meaning, so a long
# `description:` can wrap into something that scans as a new key. The
# schema-line-width hook checks the schema itself, between freezes.
max-line-width = 72

[output]

[output.html]
additional-css = ["./mdbook-admonish.css", "./mdbook-listings.css", "./schema-link.css", "./soft-wrap.css"]
additional-js = ["./mdbook-listings.js", "./schema-link.js"]
