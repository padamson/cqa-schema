# panschema consumer manifest — `panschema generate` emits the machine-readable
# formats to site/artifacts/ (deployed with the docs site). HTML comes from
# `panschema publish` + panschema-publish.toml, not here. Bare `panschema
# verify` checks everything declared here without writing outputs.
#
# `path = "."` references this repo's own package. Keys are deny_unknown_fields,
# so a typo is a hard error: note `json_schema` (underscore).
[schemas.cqa]
path = "."

[generate.cqa]
shacl = "site/artifacts/cqa-shapes.ttl"
json_schema = "site/artifacts/cqa.schema.json"
ttl = "site/artifacts/cqa.ttl"

# Wine's worked example is the graph the value-claim fixtures in
# data/claims/ are written against; scripts/verify-claim-fixtures.sh
# checks them.
[schemas.wine]
source = "github:padamson/ontology-authoring-template"
version = "0.2.1"

[generate.wine]
datasets = ["worked-example"]

# `instances` here is checked and never shipped: the claims that must
# hold. The ones that must fail sit in data/claims/invalid/.
[check.cqa]
instances = ["data/claims/holds.yaml"]
resolve_against = ["wine"]
require_namespace_coverage = true
