id: https://w3id.org/cqa/
name: cqa
# CALLOUT: domain The domain and scope settled in this chapter, recorded in the schema itself.
description: |-
  A vocabulary for competency question benchmarks over a knowledge
  graph. One record pairs a question with the specification of its
  correct answer: the answer in prose and the values it states, the
  kind of answering the question demands, and the records a correct
  answer must retrieve and cite. The graph being evaluated is
  external — its records are referenced by IRI rather than held here.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.2.0-dev

# CALLOUT: reuse The Step 2 decisions, in machine-readable form: every vocabulary this schema reuses is declared here and reached by URI.
prefixes:
  linkml: https://w3id.org/linkml/
  cqa: https://w3id.org/cqa/

  obo: http://purl.obolibrary.org/obo/
  cco: https://www.commoncoreontologies.org/

  earl: http://www.w3.org/ns/earl#
  skos: http://www.w3.org/2004/02/skos/core#
  pav: http://purl.org/pav/

default_prefix: cqa
default_range: string

# CALLOUT: imports Only linkml:types is imported. The reused vocabularies above are reached by URI, never pulled in here: imports: is for other LinkML schemas.
imports:
  - linkml:types

classes:

  # CALLOUT: item The central class. It names the data you evaluate against, not the act of evaluating: a scored attempt is a separate record an evaluation run produces.
  CompetencyQuestionAnswer:
    description: >-
      A competency question paired with the specification of its
      correct answer.
    subclass_of: cco:ont00000958
    close_mappings:
      - earl:TestCase
    slots:
      - id
      - name
      - question
      - ground_truth
      - answer_kind
      - expected_anchors
      - expected_citations
      - unconnected_anchors
      - connecting_class
      - expected_values
      - ordered_by
    # CALLOUT: scoped Unique within its benchmark, not globally: two benchmarks may each hold a cq-01 and they are different questions.
    slot_usage:
      id:
        key: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      # CALLOUT: obliged Required of the class rather than of the slot, so nothing specializing `expected_anchors` inherits an obligation to be present: the value is never there to be inherited.
      expected_anchors:
        required: true
    # CALLOUT: rule Each answer kind promises something in its own definition. These hold a record to the promise its kind makes, so the definition is a check rather than a description.
    rules:
      - description: >-
          A closed-world negative states the connection it claims is
          absent.
        preconditions:
          slot_conditions:
            answer_kind:
              equals_string: closed_world_negative
        postconditions:
          slot_conditions:
            unconnected_anchors:
              value_presence: PRESENT
      - description: >-
          An attribution names the source its answer rests on.
        preconditions:
          slot_conditions:
            answer_kind:
              equals_string: attribution
        postconditions:
          slot_conditions:
            expected_citations:
              value_presence: PRESENT
      - description: >-
          A comparison sets two or more records against each other.
        preconditions:
          slot_conditions:
            answer_kind:
              equals_string: comparison
        postconditions:
          slot_conditions:
            expected_anchors:
              minimum_cardinality: 2
      - description: >-
          A synthesis draws on two or more records, since a pattern no
          single record states needs more than one to state it.
        preconditions:
          slot_conditions:
            answer_kind:
              equals_string: synthesis
        postconditions:
          slot_conditions:
            expected_anchors:
              minimum_cardinality: 2
      # CALLOUT: order Two values at the least, since one is in order however it is given. The rule cannot see which slot each value is at, so a question whose values sit at other slots still passes.
      - description: >-
          An ordered answer states two or more values to put in order.
        preconditions:
          slot_conditions:
            ordered_by:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            expected_values:
              minimum_cardinality: 2

  # CALLOUT: set A class in its own right rather than a bare container, because two benchmarks will both hold a question called cq-01 and those must stay distinct.
  Benchmark:
    description: >-
      A named set of competency question answers, evaluated against one
      knowledge graph.
    subclass_of: cco:ont00000958
    close_mappings:
      - earl:TestRequirement
    tree_root: true
    # CALLOUT: minted The same id slot, narrowed to a pattern on the two classes cqa mints identifiers for.
    slot_usage:
      id:
        # CALLOUT: global A benchmark is one thing everywhere, so its id is an identifier.
        identifier: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    slots:
      - id
      - name
      - description
      # CALLOUT: target Which schema at which version, then each dataset at its own version, because a schema and its datasets move independently. Stated in full so a benchmark reads without knowing where it was published.
      - target_schema
      - target_schema_version
      - target_datasets
    attributes:
      competency_question_answers:
        description: The questions this benchmark holds.
        range: CompetencyQuestionAnswer
        multivalued: true
        inlined_as_list: true

  # CALLOUT: dataset No identifier, because the datasets a benchmark targets have no IRI of their own to reuse. Each is written as a blank node, described by the name its package publishes it under.
  TargetDataset:
    description: >-
      One instance graph a benchmark's anchors resolve in, at the
      version they were written against.
    subclass_of: cco:ont00000958
    slots:
      - dataset
      - version

  # CALLOUT: claim No identifier, like TargetDataset: a claim is described by what it says, and the question that holds it is the only place it is written.
  ExpectedValue:
    description: >-
      One value a correct answer states: a record of the target graph,
      one of its slots, and the value the record carries there.
    subclass_of: cco:ont00000958
    slots:
      - record
      - slot
      - value

  # CALLOUT: placeholder The one class with no grounding: it stands for a record in someone else's graph, and what that record is varies by domain.
  DomainRecord:
    description: >-
      A record in the knowledge graph that a benchmark is evaluated
      against. Its instances belong to that graph, not to this schema.
    slots:
      - id
    slot_usage:
      id:
        identifier: true

slots:

  # CALLOUT: neither No identifier or key on the shared slot. A class's slot_usage adds to the slot rather than replacing it, so a flag here plus the other flag on a class is a slot that is both, which LinkML forbids.
  id:
    description: >-
      The short, stable identifier a record is known by.

  name:
    description: >-
      A short human-readable label.

  description:
    description: >-
      A longer prose account of what this benchmark covers.

  question:
    description: >-
      The competency question, in the words it would be asked in.
    required: true

  ground_truth:
    description: >-
      The correct answer in prose. A generated answer is scored against
      this; the anchors below are what retrieval is scored against.
    required: true

  # CALLOUT: kinds Multivalued, because a question can call for more than one kind of answering at once, and every kind named is a check that must pass.
  answer_kind:
    description: >-
      The kinds of answering this question calls for. Every kind named
      is a separate check, and all of them must pass.
    range: AnswerKindEnum
    multivalued: true
    required: true

  # CALLOUT: anchors Named for what retrieval must reach, not for evidence: a correct "nothing on record" answer still has to reach the records whose missing connection is the answer.
  expected_anchors:
    description: >-
      The records a correct answer must retrieve, as IRIs into the
      target graph. For an answer that reports no such record exists,
      these are the records whose absent connection is the answer, and
      reaching them is what distinguishes that answer from a system
      that retrieved nothing.
    range: DomainRecord
    multivalued: true
    # CALLOUT: base How an anchor is written is part of the contract, so the base a short anchor expands against is declared here rather than configured by each consumer. It is the benchmark's target_schema, resolved from the containing record: a benchmark states its target once and holds many questions.
    annotations:
      expand_against: target_schema

  # CALLOUT: subset A subslot, so "among the anchors" is a fact about the data rather than a request in prose: every citation is an anchor by the relation itself, and stating it here is what makes it checkable.
  expected_citations:
    description: >-
      The records a correct answer must rest on, as IRIs into the
      target graph. Always among the anchors: retrieving a record is
      not the same as answering from it. Empty is a real answer.
    is_a: expected_anchors
    range: DomainRecord
    multivalued: true
    annotations:
      expand_against: target_schema

  # CALLOUT: absence What the negative claims, not just that it claims one. Without it an evaluator knows an answer of "nothing on record" was expected and cannot check that it is still true.
  unconnected_anchors:
    description: >-
      The anchors that no single record joins, for an answer whose
      correctness is that the graph holds no such connection. A subset
      of the anchors: a claim about a record retrieval was never
      required to reach cannot be checked against what was retrieved.
      Records held by a container do not count as joined by it.
    is_a: expected_anchors
    range: DomainRecord
    multivalued: true
    annotations:
      expand_against: target_schema
      asserts_absence:
        value:
          via_slot: connecting_class

  connecting_class:
    description: >-
      The class a joining record would belong to, as a URI in the
      target schema. Optional, because a benchmark can be written
      against a graph whose schema its author does not have: without
      it the claim is that no record of any kind joins the anchors,
      and with it the claim is narrowed to one kind.
    range: uri

  expected_values:
    description: >-
      The values a correct answer states, each read from a record of
      the target graph. Every record named is among the anchors, since
      a value an answer depends on comes from a record the answer has
      to retrieve.
    range: ExpectedValue
    multivalued: true
    inlined_as_list: true
    # CALLOUT: values The slot says what each entry claims, so a checker reads the record, the slot and the value from the entry and compares them with the target graph. "Among the anchors" reaches from the entry to the question that holds it, which no LinkML rule can.
    annotations:
      asserts_value:
        value:
          record_slot: record
          slot_slot: slot
          value_slot: value
          among: expected_anchors

  # CALLOUT: ordered The order is read from values the target graph carries, so each of them is checked against the graph, and they survive in Turtle, where a list's order does not. The order itself is the grader's to check, against an answer.
  ordered_by:
    description: >-
      The slot whose values order a correct answer, by the name the
      target schema gives it. A correct answer gives the records its
      expected values name at this slot in ascending order of those
      values, as the slot's range orders them.

  record:
    description: >-
      The record that carries the value, as an IRI into the target
      graph.
    range: DomainRecord
    required: true
    annotations:
      expand_against: target_schema

  # CALLOUT: named A slot is named as the target's instance data writes it, where connecting_class names a class by IRI, as the target graph types its records.
  slot:
    description: >-
      The slot that carries the value, by the name the target schema
      gives it.
    required: true

  # CALLOUT: quoted Text, read by the range of the target slot rather than by YAML, so a number is written quoted and a value such as no stays text.
  value:
    description: >-
      The value, written as the target graph's data writes it and read
      by the range of the slot it is claimed at.
    required: true

  target_schema:
    description: >-
      The schema the target graph's records conform to, as a URI.
    range: uri
    required: true

  target_schema_version:
    description: >-
      The version of the target schema the anchors were written
      against: the release identifier of whatever publishes the schema,
      which can differ from the version the schema file declares. It
      fixes how identifiers are minted, which can change between
      releases.
    required: true
    # CALLOUT: pin The slot says which sibling's version it records, so a benchmark checked against a release other than the one it was written for fails instead of reading green. Without the declaration the target slots are documentation.
    annotations:
      records_version_of:
        value:
          sibling_slot: target_schema

  target_datasets:
    description: >-
      The instance graphs the anchors resolve in. One schema can have
      several, they need not hold the same records, and one question's
      anchors can lie in more than one, so naming the schema and its
      version does not identify them.
    range: TargetDataset
    multivalued: true
    inlined_as_list: true
    required: true

  dataset:
    description: >-
      Which instance graph, named as the target package publishes it:
      a dataset name from that package's publish manifest.
    required: true

  version:
    description: >-
      The version of the dataset the anchors were written against: the
      release identifier of whatever publishes it, which is the
      schema's own version when the two ship together. It fixes which
      records exist, since records can be added, corrected or removed
      without the schema changing.
    slot_uri: pav:version
    required: true
    annotations:
      records_version_of:
        value:
          sibling_slot: dataset

enums:

  AnswerKindEnum:
    description: >-
      The kinds of answering a competency question can call for. Each
      names a different check on a correct answer.
    permissible_values:
      lookup:
        description: >-
          A value read from a single record.
      closed_world_negative:
        description: >-
          The correct answer is that the graph holds no such record.
          Absence of a record is not evidence against the claim, only
          absence of a claim for it.
      comparison:
        description: >-
          Two or more records set against each other on a shared slot.
      synthesis:
        description: >-
          A pattern across several records that no single record
          states.
      attribution:
        description: >-
          An answer that must carry the source it rests on. The
          question is answerable without it, but not answerable well.
